name: Release

# Run by hand (Actions > Release > Run workflow): one release with one build number.
# - flightsim.to: the portable client and the MSFS toolbar panel in one zip, with the installation notes (flightsim.yml).
#   Signed when the signing secrets are set up. Download it from the run's artifacts and upload it to flightsim.to by hand.
# - Microsoft Store (optional): the Store package, uploaded to Partner Center with msstore (store.yml). "Upload as draft"
#   leaves the submission in Partner Center to check and submit there; "Upload and submit" sends it for certification.
# Both use the same build number, so the client shows the same "Airsports 2.0.0 (<build>)" wherever it was installed from.
# Leave the build number empty and it counts on by itself (see BUILD_NUMBER_OFFSET); a number entered by hand is used as
# it is. The Store needs a build number higher than its last one.
#
# Each part can still be run on its own: "Release for flightsim.to" and "Deploy to Microsoft Store". The secrets are in
# the "release" (signing) and "store" (Partner Center) environments, as described in those workflows.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number; leave empty to count on automatically (the client shows \"Airsports 2.0.0 (<build>)\")"
        required: false
        type: string
        default: ""
      flightsim:
        description: "Build the flightsim.to package"
        required: false
        type: boolean
        default: true
      github_release:
        description: "Create a draft GitHub release with the flightsim.to package (publish it on the Releases page)"
        required: false
        type: boolean
        default: true
      store:
        description: "Microsoft Store"
        required: false
        type: choice
        default: "Do not upload"
        options:
          - "Do not upload"
          - "Upload as draft"
          - "Upload and submit"

permissions:
  contents: read

env:
  # Automatic build numbers are this workflow's run number plus this offset: run 1 was build 37, entered by hand after the
  # test builds 32-36, so the next automatic one is 38 and they keep rising. The Store only needs each build to be higher
  # than the last, so a failed run that uses up a number does no harm. Raise the offset if a number was ever entered by
  # hand that is above the automatic ones.
  BUILD_NUMBER_OFFSET: 36

jobs:
  # The build number both parts use: the one entered, or the next automatic one.
  version:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - id: number
        shell: bash
        env:
          ENTERED: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          entered="${ENTERED// /}"
          if [ -z "$entered" ]; then
            build=$((RUN_NUMBER + BUILD_NUMBER_OFFSET))
            how="automatic: run $RUN_NUMBER + $BUILD_NUMBER_OFFSET"
          elif [[ "$entered" =~ ^[0-9]+$ ]] && [ "$entered" -ge 1 ] && [ "$entered" -le 65535 ]; then
            build=$entered
            how="entered by hand"
          else
            echo "::error::The build number must be a whole number from 1 to 65535, or empty for the next automatic one."
            exit 1
          fi
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "Build number $build ($how)"

  flightsim:
    needs: version
    if: inputs.flightsim
    uses: ./.github/workflows/flightsim.yml
    with:
      build_number: ${{ fromJSON(needs.version.outputs.build_number) }}
    secrets: inherit

  store:
    needs: version
    if: inputs.store != 'Do not upload'
    uses: ./.github/workflows/store.yml
    with:
      build_number: ${{ fromJSON(needs.version.outputs.build_number) }}
      submit: ${{ inputs.store == 'Upload and submit' }}
    secrets: inherit

  # A draft GitHub release v2.0.0-<build> with the flightsim.to zip and the panel-only zip attached: a lasting download
  # link and a record of each version. It stays a draft (the tag is only made when it is published on the Releases
  # page). Running the same build again replaces the files of its draft.
  github-release:
    needs: [version, flightsim]
    if: inputs.flightsim && inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flightsim-to-${{ needs.version.outputs.build_number }}
          path: release-files
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="v2.0.0-$BUILD_NUMBER"
          bundle="release-files/dist/Airsports-MSFS-2.0.0-$BUILD_NUMBER.zip"
          panel="release-files/msfs-panel/dist/airsports-flight-display-1.0.$BUILD_NUMBER.zip"
          for file in "$bundle" "$panel"; do
            if [ ! -f "$file" ]; then echo "::error::$file is not in the flightsim.to artifact"; exit 1; fi
          done
          cat > notes.md <<NOTES
          Air Sports Live Tracking for Microsoft Flight Simulator, version 2.0.0 (build $BUILD_NUMBER).

          **Downloads**
          - \`Airsports-MSFS-2.0.0-$BUILD_NUMBER.zip\`: the client and the MSFS toolbar panel. Unzip it anywhere and start
            \`Airsports client\\msfsclient.exe\`; README.txt covers installation, setup and the first flight. This is the
            file for flightsim.to.
          - \`airsports-flight-display-1.0.$BUILD_NUMBER.zip\`: the toolbar panel alone, for the MSFS Community folder.

          Works with MSFS 2020 and 2024 on Windows 10 (1809 or later) or 11, 64-bit.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$panel" --clobber
            echo "Updated the files of release $tag"
          else
            gh release create "$tag" "$bundle" "$panel" --draft --target "$COMMIT" \
              --title "Air Sports MSFS client 2.0.0 (build $BUILD_NUMBER)" --notes-file notes.md
            echo "Created draft release $tag"
          fi

  summary:
    needs: [version, flightsim, store, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: What was released
        shell: bash
        env:
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          VERSION: ${{ needs.version.result }}
          FLIGHTSIM: ${{ needs.flightsim.result }}
          STORE: ${{ needs.store.result }}
          GITHUB_RELEASE: ${{ needs.github-release.result }}
          STORE_CHOICE: ${{ inputs.store }}
        run: |
          describe() { case "$1" in success) echo "done";; skipped) echo "not asked for";; *) echo "**$1**";; esac; }
          if [ "$VERSION" != success ]; then
            echo "## Release not started: the build number was not valid" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Release, build $BUILD_NUMBER"
            echo ""
            echo "| Part | Result |"
            echo "|---|---|"
            echo "| flightsim.to package | $(describe "$FLIGHTSIM") |"
            echo "| Microsoft Store ($STORE_CHOICE) | $(describe "$STORE") |"
            echo "| Draft GitHub release | $(describe "$GITHUB_RELEASE") |"
            echo ""
            if [ "$FLIGHTSIM" = success ]; then
              echo "flightsim.to: download the artifact \`flightsim-to-$BUILD_NUMBER\` below (the zip, the panel-only zip and the listing text) and upload the zip to flightsim.to."
            fi
            if [ "$GITHUB_RELEASE" = success ]; then
              echo "GitHub: draft release \`v2.0.0-$BUILD_NUMBER\` with the zips attached. Check it and publish it on the Releases page."
            fi
            if [ "$STORE" = success ]; then
              if [ "$STORE_CHOICE" = "Upload and submit" ]; then
                echo "Microsoft Store: submitted for certification. Follow it in Partner Center."
              else
                echo "Microsoft Store: uploaded as a draft submission. Check and submit it in Partner Center."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The run fails when a part that was asked for failed.
          for result in "$FLIGHTSIM" "$STORE" "$GITHUB_RELEASE"; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then exit 1; fi
          done
