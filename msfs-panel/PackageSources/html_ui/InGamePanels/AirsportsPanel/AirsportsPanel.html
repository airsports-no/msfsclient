<!DOCTYPE html>
<!--
    The Airsports flight display in the MSFS toolbar. The content is the same hud.js and hud.css the client serves at
    http://localhost:47911/; it connects to the client running on this PC. The ingame-ui frame gives the panel the
    simulator's own title bar, moving, resizing and pop-out (right Alt + click).
-->
<html>
<head>
    <title>Airsports</title>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="/SCSS/common.css" />
    <link rel="stylesheet" href="./hud.css" />
    <link rel="stylesheet" href="./AirsportsPanel.css" />

    <script type="text/javascript" src="/JS/coherent.js"></script>
    <script type="text/javascript" src="/JS/common.js"></script>
    <script type="text/javascript" src="/JS/dataStorage.js"></script>
    <script type="text/javascript" src="/JS/buttons.js"></script>
    <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>

    <link rel="import" href="/templates/NewPushButton/NewPushButton.html" />
    <link rel="import" href="/templates/ingameUi/ingameUi.html" />
    <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
</head>

<body class="border-box">
    <ingame-ui
        id="AirsportsPanel_Frame"
        panel-id="PANEL_AIRSPORTS"
        class="ingameUiFrame panelInvisible"
        title="Airsports"
        content-fit="false"
        min-width="20"
        min-height="20"
    >
        <div id="airsports-hud"></div>
    </ingame-ui>
    <script type="text/javascript" src="./hud.js"></script>
</body>
</html>
